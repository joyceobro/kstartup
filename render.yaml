services:
  - type: web
    name: kstartup-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.12
      - key: KIPRIS_KEY
        sync: false
      - key: DATA_GO_KR_KEY
        sync: false
      - key: DART_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # LLM 근거 서술 레이어(기본: Gemini OpenAI 호환, 무료). 미설정이어도 서비스는 정상 동작(서술만 생략).
      - key: LLM_API_KEY
        sync: false
